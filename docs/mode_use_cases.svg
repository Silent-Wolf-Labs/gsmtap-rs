<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title description">
  <title id="title">GSMTAP workbench operating modes</title>
  <desc id="description">Three diagrams show listen, relay, and modify mode. Traffic is received by the workbench over GSMTAP UDP. Listen mode does not forward, relay mode records packets and forwards selected batches with an explicit web UI action, and modify mode sends an edited packet only after explicit confirmation in the web UI.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
    <linearGradient id="workbench" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient>
    <linearGradient id="endpoint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef3c7"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="ui" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#15803d"/></marker>
    <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c2410c"/></marker>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#172033}.subtitle{font:400 15px Arial,sans-serif;fill:#526074}.mode{font:700 21px Arial,sans-serif;fill:#172033}.purpose{font:400 14px Arial,sans-serif;fill:#526074}.node-title{font:700 16px Arial,sans-serif;fill:#172033;text-anchor:middle}.node-text{font:400 13px Arial,sans-serif;fill:#334155;text-anchor:middle}.edge{font:600 12px Arial,sans-serif;fill:#334155;text-anchor:middle}.note{font:600 13px Arial,sans-serif;text-anchor:middle}.panel{fill:#fff;stroke:#d5dce7;stroke-width:1.5}.node{stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="930" fill="url(#background)"/>
  <text x="600" y="48" class="title" text-anchor="middle">GSMTAP workbench operating modes</text>
  <text x="600" y="75" class="subtitle" text-anchor="middle">Each mode receives GSMTAP over UDP; the difference is what happens after capture.</text>

  <rect x="35" y="105" width="1130" height="235" rx="14" class="panel"/>
  <text x="65" y="143" class="mode">LISTEN</text><text x="65" y="167" class="purpose">Passive inspection: receive packets and display them; do not forward them.</text>
  <rect x="90" y="205" width="190" height="75" rx="10" fill="url(#endpoint)" stroke="#d97706" class="node"/><text x="185" y="234" class="node-title">GSMTAP producer</text><text x="185" y="256" class="node-text">radio simulator / tool</text>
  <rect x="480" y="195" width="240" height="95" rx="10" fill="url(#workbench)" stroke="#2563eb" class="node"/><text x="600" y="229" class="node-title">gsmtap-workbench</text><text x="600" y="252" class="node-text">bind UDP :4729</text><text x="600" y="272" class="node-text">capture + inspect</text>
  <rect x="920" y="205" width="190" height="75" rx="10" fill="url(#ui)" stroke="#15803d" class="node"/><text x="1015" y="234" class="node-title">Web UI</text><text x="1015" y="256" class="node-text">view and filter history</text>
  <line x1="280" y1="242" x2="470" y2="242" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/><text x="375" y="226" class="edge">GSMTAP / UDP</text>
  <line x1="720" y1="242" x2="910" y2="242" stroke="#15803d" stroke-width="2.5" marker-end="url(#green-arrow)"/><text x="815" y="226" class="edge">status + packet history</text>
  <rect x="455" y="304" width="290" height="25" rx="12" fill="#fee2e2" stroke="#ef4444"/><text x="600" y="321" class="note" fill="#b91c1c">&#10005; No UDP forwarding</text>

  <rect x="35" y="365" width="1130" height="235" rx="14" class="panel"/>
  <text x="65" y="403" class="mode">RELAY</text><text x="65" y="427" class="purpose">Inspect received packets and explicitly forward a selected batch.</text>
  <rect x="90" y="465" width="190" height="75" rx="10" fill="url(#endpoint)" stroke="#d97706" class="node"/><text x="185" y="494" class="node-title">GSMTAP producer</text><text x="185" y="516" class="node-text">source endpoint</text>
  <rect x="480" y="455" width="240" height="95" rx="10" fill="url(#workbench)" stroke="#2563eb" class="node"/><text x="600" y="489" class="node-title">gsmtap-workbench</text><text x="600" y="512" class="node-text">receive + record</text><text x="600" y="532" class="node-text">await selected batch</text>
  <rect x="920" y="465" width="190" height="75" rx="10" fill="url(#endpoint)" stroke="#d97706" class="node"/><text x="1015" y="494" class="node-title">GSMTAP consumer</text><text x="1015" y="516" class="node-text">target endpoint</text>
  <line x1="280" y1="502" x2="470" y2="502" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/><text x="375" y="486" class="edge">original datagram</text>
  <line x1="720" y1="502" x2="910" y2="502" stroke="#15803d" stroke-width="2.5" marker-end="url(#green-arrow)"/><text x="815" y="486" class="edge">selected batch / same bytes</text>
  <line x1="600" y1="550" x2="600" y2="555" stroke="#15803d" stroke-width="2"/>
  <rect x="480" y="555" width="240" height="25" rx="12" fill="url(#ui)" stroke="#15803d" class="node"/><text x="600" y="572" class="node-text">Web UI: select + Forward selected</text>
  <text x="600" y="595" class="note" fill="#166534">No automatic forwarding; selected packets keep their original bytes.</text>

  <rect x="35" y="625" width="1130" height="265" rx="14" class="panel"/>
  <text x="65" y="663" class="mode">MODIFY</text><text x="65" y="687" class="purpose">Capture and replay: edit, preview, and explicitly send a selected packet.</text>
  <rect x="75" y="735" width="175" height="75" rx="10" fill="url(#endpoint)" stroke="#d97706" class="node"/><text x="162" y="764" class="node-title">GSMTAP producer</text><text x="162" y="786" class="node-text">source endpoint</text>
  <rect x="330" y="725" width="215" height="95" rx="10" fill="url(#workbench)" stroke="#2563eb" class="node"/><text x="437" y="759" class="node-title">gsmtap-workbench</text><text x="437" y="782" class="node-text">capture + retain</text><text x="437" y="802" class="node-text">selected packet</text>
  <rect x="645" y="725" width="215" height="95" rx="10" fill="url(#ui)" stroke="#15803d" class="node"/><text x="752" y="759" class="node-title">Web UI</text><text x="752" y="782" class="node-text">edit + preview</text><text x="752" y="802" class="node-text">confirm and send</text>
  <rect x="960" y="735" width="175" height="75" rx="10" fill="url(#endpoint)" stroke="#d97706" class="node"/><text x="1047" y="764" class="node-title">GSMTAP target</text><text x="1047" y="786" class="node-text">forward endpoint</text>
  <line x1="250" y1="772" x2="320" y2="772" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/><text x="285" y="756" class="edge">packet</text>
  <line x1="545" y1="772" x2="635" y2="772" stroke="#15803d" stroke-width="2.5" marker-end="url(#green-arrow)"/><text x="590" y="756" class="edge">select</text>
  <line x1="860" y1="772" x2="950" y2="772" stroke="#c2410c" stroke-width="2.5" marker-end="url(#orange-arrow)"/><text x="905" y="756" class="edge">edited packet</text>
  <rect x="510" y="844" width="380" height="27" rx="13" fill="#ffedd5" stroke="#fb923c"/><text x="700" y="862" class="note" fill="#9a3412">&#8594; Sent only after explicit UI confirmation</text>
</svg>
