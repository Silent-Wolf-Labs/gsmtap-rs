name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo build --release --locked

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  security-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  security-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-cyclonedx
      - run: cargo cyclonedx --format json
      - run: test -s gsmtap-rs.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: gsmtap-rs-sbom
          path: gsmtap-rs.cdx.json
          if-no-files-found: error

  security-auditable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-auditable
      - run: cargo auditable build --release --locked

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target workbench --tag gsmtap-workbench:ci .
      - run: docker build --target traffic-test --tag gsmtap-traffic-test:ci .

  integration:
    needs: container
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [listen, relay, modify]
    steps:
      - uses: actions/checkout@v4
      - name: Run ${{ matrix.mode }}-mode Compose verification
        run: |
          set -eu
          compose_file=tests/integration/compose.yaml
          trap 'docker compose -f "$compose_file" down --remove-orphans --volumes' EXIT
          GSMTAP_MODE="${{ matrix.mode }}" docker compose -f "$compose_file" build
          GSMTAP_MODE="${{ matrix.mode }}" docker compose -f "$compose_file" up \
            --abort-on-container-exit \
            --exit-code-from traffic
