<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GSMTAP Workbench</title>
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
  <main>
    <h1>GSMTAP Workbench</h1>
    <div id="status" aria-live="polite"></div>
    <section id="send-section" hidden>
      <h2>Modify selected packet</h2>
      <p id="selected-packet">Select a decoded RX packet to edit it.</p>
      <form id="send-form">
        <div id="fields"></div>
        <label>Extension (hex)<textarea name="extensionHex"></textarea></label>
        <label>Payload (hex)<textarea name="payloadHex"></textarea></label>
        <button>Preview changes</button>
        <button id="confirm-send" type="button" disabled>Confirm and send</button>
      </form>
      <pre id="preview"></pre>
      <pre id="result"></pre>
    </section>
    <section>
      <h2>Packet history</h2>
      <div id="filters"></div>
      <div id="packets"></div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
