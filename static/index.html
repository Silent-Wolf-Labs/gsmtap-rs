<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GSMTAP Workbench</title>
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
  <main>
    <header>
      <h1>GSMTAP Workbench</h1>
      <div id="status" role="status" aria-live="polite"></div>
    </header>
    <section id="send-section" class="card" aria-labelledby="modify-selected-packet-heading" tabindex="-1" hidden>
      <h2 id="modify-selected-packet-heading">Modify selected packet</h2>
      <p id="selected-packet">Select a decoded RX packet to edit it.</p>
      <form id="send-form">
        <div id="fields" class="modify-fields"></div>
      </form>
      <section id="preview-card" class="card modify-preview-card" aria-labelledby="review-changes-heading" hidden>
        <h3 id="review-changes-heading">Review changes</h3>
        <pre id="preview"></pre>
        <button id="confirm-send" type="button" disabled>Confirm and send</button>
        <p id="result" role="status" aria-live="polite"></p>
      </section>
    </section>
    <section id="packet-history" aria-labelledby="packet-history-heading">
      <h2 id="packet-history-heading">Packet history</h2>
      <div id="filters"></div>
      <div id="packets"></div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
