<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GSMTAP Workbench</title>
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
  <main>
    <h1>GSMTAP Workbench</h1>
    <div id="status" aria-live="polite"></div>
    <section id="send-section" class="card" tabindex="-1" hidden>
      <h2>Modify selected packet</h2>
      <p id="selected-packet">Select a decoded RX packet to edit it.</p>
      <form id="send-form">
        <div id="fields" class="modify-fields"></div>
      </form>
      <section id="preview-card" class="card modify-preview-card" hidden>
        <h3>Review changes</h3>
        <pre id="preview"></pre>
        <button id="confirm-send" type="button" disabled>Confirm and send</button>
        <p id="result" aria-live="polite"></p>
      </section>
    </section>
    <section>
      <h2>Packet history</h2>
      <div id="filters"></div>
      <div id="packets"></div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
