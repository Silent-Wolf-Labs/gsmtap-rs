[graph]
# Check the optional osmocore feature's dependency graph too.
all-features = true

[advisories]
version = 2

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# Only the optional osmocore feature links GPL code.
exceptions = [{ allow = ["GPL-3.0-or-later"], crate = "osmocore-rs" }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
